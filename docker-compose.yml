name: habits

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-habits}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habits}
      POSTGRES_DB: ${POSTGRES_DB:-habits}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5443}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-habits}
      DATABASE_USER: ${POSTGRES_USER:-habits}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-habits}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-0123456789}
      JWT_TTL: ${JWT_TTL:-7d}
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5183}
      # Creates demo@example.com / demo-password with half a year of sample data.
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${API_PORT:-4403}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-5183}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
